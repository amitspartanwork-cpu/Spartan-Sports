<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Spartan Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <header class="nav">
    <a class="logo" href="index.html" aria-label="Spartan Sports home">
      <img class="brand-mark" src="spartan-logo.png" alt="">
      <span>Spartan Sports</span>
    </a>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h2>Create account</h2>
      <p class="sub">Join Spartan Sports inventory management.</p>

      <!-- Role tabs -->
      <div class="role-tabs" role="tablist" aria-label="Register as">
        <button class="active" data-role="user" role="tab" aria-selected="true" onclick="setRegRole('user')">👤
          User</button>
        <button data-role="admin" role="tab" aria-selected="false" onclick="setRegRole('admin')">🛡️ Admin</button>
      </div>

      <div class="alert" id="regAlert" role="alert"></div>

      <form id="regForm" novalidate>

        <div class="form-group">
          <label for="regName">Name</label>
          <input type="text" id="regName" placeholder="Your name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="regPass">Password</label>
          <div class="pw-wrap">
            <input type="password" id="regPass" placeholder="Min 8 characters" autocomplete="new-password" required
              minlength="8">
            <button type="button" class="pw-toggle" aria-label="Toggle password visibility"
              onclick="togglePw('regPass', this)">👁</button>
          </div>
        </div>

        <!-- Admin secret key (shown only for admin tab) -->
        <div class="form-group" id="adminKeyGroupReg" style="display:none">
          <label for="regAdminKey">Admin secret key</label>
          <div class="pw-wrap">
            <input type="password" id="regAdminKey" placeholder="Enter admin key" autocomplete="off">
            <button type="button" class="pw-toggle" aria-label="Toggle key visibility"
              onclick="togglePw('regAdminKey', this)">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-full">Create account →</button>
      </form>

      <p class="switch-link">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="xlsx.full.min.js"></script>
  <script src="auth.js"></script>
</body>

</html>
